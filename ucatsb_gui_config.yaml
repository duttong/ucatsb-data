  special_comments: |-
    Error estimates are based on the assigned values of the onboard calibration
    cylinders, the scatter of the in-flight calibration record, and the drift
    model used to interpolate between calibrations. The UNCERTAINTY line above
    gives the median 1-sigma for each species on this flight.
    CO2, N2O and CH4 are reported as dry air mole fractions. O3 and H2O are
    reported as measured and are not calibrated against onboard standards.

    If you use these data in a publication or report, we would appreciate that
